version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: "09:41"
    timezone: Etc/UTC
  groups:
    routine-updates:
      patterns:
      - '*'
      exclude-patterns:
      - nicodes/tools/*
      - nicodes/cicd/*
      - nicodes/komizo-actions/*
      - aviorstudio/gdam-actions/*
      - '*clerk*'
      - '*pocketbase*'
      - '*crypto*'
      - '*jsonwebtoken*'
      - '*jose*'
      - '*oauth*'
      - '*openid*'
      - '*passport*'
      - '*bcrypt*'
      - '*argon2*'
      - '@noble/*'
      - '*prisma*'
      - '*drizzle*'
      - '*migrate*'
      - github.com/charmbracelet/colorprofile
      - github.com/charmbracelet/x/ansi
      - github.com/charmbracelet/x/cellbuf
      - github.com/charmbracelet/x/term
      - github.com/clipperhouse/displaywidth
      - github.com/clipperhouse/stringish
      - github.com/erikgeiser/coninput
      - github.com/mattn/go-isatty
      - github.com/mattn/go-localereader
      - github.com/mattn/go-runewidth
      - github.com/muesli/ansi
      - github.com/muesli/cancelreader
      - github.com/muesli/termenv
      - github.com/rivo/uniseg
      - github.com/xo/terminfo
      - golang.org/x/sys
      - golang.org/x/text
      - modernc.org/sqlite
      - github.com/jackc/pgx/*
      - github.com/go-sql-driver/mysql
      - go.mongodb.org/mongo-driver/*
      update-types:
      - minor
      - patch
    managed-releases:
      patterns:
      - nicodes/tools/*
      - nicodes/cicd/*
      - nicodes/komizo-actions/*
      - aviorstudio/gdam-actions/*
      update-types:
      - minor
      - patch
    security-fixes:
      applies-to: security-updates
      patterns:
      - '*'
      exclude-patterns:
      - nicodes/tools/*
      - nicodes/cicd/*
      - nicodes/komizo-actions/*
      - aviorstudio/gdam-actions/*
      - '*clerk*'
      - '*pocketbase*'
      - '*crypto*'
      - '*jsonwebtoken*'
      - '*jose*'
      - '*oauth*'
      - '*openid*'
      - '*passport*'
      - '*bcrypt*'
      - '*argon2*'
      - '@noble/*'
      - '*prisma*'
      - '*drizzle*'
      - '*migrate*'
      - modernc.org/sqlite
      - github.com/jackc/pgx/*
      - github.com/go-sql-driver/mysql
      - go.mongodb.org/mongo-driver/*
  open-pull-requests-limit: 5
  cooldown:
    default-days: 3
- package-ecosystem: cargo
