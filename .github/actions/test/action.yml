name: Test
description: Verify the canonical Go, Godot, package and editor lifecycle gates.
runs:
  using: composite
  steps:
    - name: "Set up Godot"
      uses: nicodes/tools/godot-setup@ca747e13a51f301f51635c262d883d57d6084ae3 # v0.27.1
      with:
        version: 4.7.2
        binary-checksum: sha256:cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
    - name: Check the complete addon profile
      shell: bash
      run: make check
