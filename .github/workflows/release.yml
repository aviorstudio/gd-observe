name: Release
'on':
  workflow_dispatch:
    inputs:
      target:
        description: Release target
        required: true
        type: choice
        options:
        - gd
        - cli
      bump:
        description: Version bump
        required: true
        type: choice
        options:
        - patch
        - minor
        - major
concurrency: release-${{ github.repository }}-${{ inputs.target }}
jobs:
  test:
    name: Test package
    permissions:
      contents: read
      attestations: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Set up development tools
      uses: nicodes/tools/setup@589def59661a722c91f17acbc6c7ef9b41d06189
      env:
        GH_TOKEN: ${{ github.token }}
      timeout-minutes: 5
    - name: Check project
      shell: bash
      run: |
        set -euo pipefail
        mise run check
    - name: Upload artifacts
      if: inputs.target == 'gd'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: gd-observe-addon-${{ github.sha }}
        path: dist/@aviorstudio_gd-observe.zip
        if-no-files-found: error
        retention-days: 1
    env:
      MISE_GITHUB_TOKEN: ${{ github.token }}
  release:
    name: Release
    needs: test
    permissions:
      contents: write
      attestations: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Determine release version
      id: release
      env:
        TARGET: ${{ inputs.target }}
        BUMP: ${{ inputs.bump }}
      run: |
        set -euo pipefail
        test "$GITHUB_REF" = refs/heads/main || { echo 'Run releases from main.' >&2; exit 1; }
        case "$TARGET" in gd) prefix=gd-v ;; cli) prefix=cli-v ;; *) exit 1 ;; esac
        git fetch --tags --force
        latest="$(git tag --list "${prefix}[0-9]*" | sed -E "s/^${prefix}//" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
        test -n "$latest" || latest=0.0.0
        IFS=. read -r major minor patch <<< "$latest"
        case "$BUMP" in
          major) major=$((major + 1)); minor=0; patch=0 ;;
          minor) minor=$((minor + 1)); patch=0 ;;
          patch) patch=$((patch + 1)) ;;
          *) exit 1 ;;
        esac
        version="$major.$minor.$patch"
        tag="$prefix$version"
        if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
          echo "Release tag already exists; refusing to replace it." >&2
          exit 1
        fi
        if [ "$TARGET" = gd ]; then
          plugin_version="$(sed -n -E 's/^version="([^"]+)"/\1/p' gd/addon/plugin.cfg | head -n 1)"
          test "$plugin_version" = "$version" || { echo "plugin.cfg=$plugin_version next=$version" >&2; exit 1; }
        fi
        printf 'version=%s\ntag=%s\ndate=%s\n' "$version" "$tag" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
    - name: Download artifacts
      if: inputs.target == 'gd'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: gd-observe-addon-${{ github.sha }}
        path: dist
    - name: Create GitHub Release from tested bytes
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ steps.release.outputs.tag }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        files=(dist/*.tar.gz dist/*.zip)
        [ ! -f dist/checksums.txt ] || files+=(dist/checksums.txt)
        [ "${#files[@]}" -gt 0 ] || { echo 'No release assets.' >&2; exit 1; }
        sha256sum "${files[@]}"
        gh release create "$TAG" "${files[@]}" --target "$GITHUB_SHA" --title "$TAG" --notes "Release $TAG from exact tested commit $GITHUB_SHA."
      if: inputs.target == 'gd'
    - name: Publish addon
      if: inputs.target == 'gd'
      uses: aviorstudio/gdam-actions/publish@3a46007e296e60e15a4ad47727ad33046e52e6ea
      with:
        tag: ${{ steps.release.outputs.tag }}
        asset: '@aviorstudio_gd-observe.zip'
        api-key: ${{ secrets.GDAM_API_KEY }}
    env:
      MISE_GITHUB_TOKEN: ${{ github.token }}
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      date: ${{ steps.release.outputs.date }}
  build-cli:
    name: Build native CLI
    needs: release
    if: inputs.target == 'cli'
    uses: ./.github/workflows/cli-native.yml
    permissions:
      contents: read
    with:
      release: true
      version: ${{ needs.release.outputs.version }}
      date: ${{ needs.release.outputs.date }}
  accept-cli:
    name: Accept CLI release archives
    needs: build-cli
    if: inputs.target == 'cli'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Download native archives
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        pattern: native-cli-*
        merge-multiple: true
        path: dist
    - name: Require all six platforms and record checksums
      run: |
        set -euo pipefail
        cd dist
        for platform in Linux Darwin Windows; do
          extension=tar.gz
          [ "$platform" != Windows ] || extension=zip
          for arch in x86_64 arm64; do
            test -s "gdobs_${platform}_${arch}.${extension}"
          done
        done
        test "$(find . -maxdepth 1 -type f | wc -l)" -eq 6
        sha256sum ./*.tar.gz ./*.zip > checksums.txt
    - name: Upload accepted archives
      id: accepted
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: accepted-cli-${{ github.sha }}-${{ github.run_attempt }}
        path: dist/*
        if-no-files-found: error
        retention-days: 7
    outputs:
      artifact-id: ${{ steps.accepted.outputs.artifact-id }}
  publish-cli:
    name: Publish release
    needs: [release, accept-cli]
    uses: nicodes/tools/.github/workflows/cli-publish.yml@9590742a455154ac5967a67952c5758d79d476b9
    permissions:
      contents: write
    with:
      tools-ref: 9590742a455154ac5967a67952c5758d79d476b9
      binary: gdobs
      tag: ${{ needs.release.outputs.tag }}
      artifact-id: ${{ needs.accept-cli.outputs.artifact-id }}
    if: inputs.target == 'cli'
