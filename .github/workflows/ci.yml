name: "Build & Test"

# CI and release call the same repository-local gate. The resulting addon ZIP
# is the tested artifact and release downloads it without rebuilding.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: "Test"
    runs-on: ubuntu-24.04
    env:
      SOURCE_SHA: ${{ github.sha }}
    # Bounded, so a step that hangs fails here rather than sitting until the
    # runner's own timeout hours later.
    timeout-minutes: 20
    steps:
      # Third-party actions are pinned by SHA, with the tag in a trailing
      # comment so the version is still readable. A tag is a moving reference:
      # whoever can move it can run code in this job.
      - name: "Check out source"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record tested integration identity
        if: github.event_name == 'pull_request'
        uses: nicodes/tools/integration-identity@247267492cd455647facafcfcc6eed4c63c49c0e # v0.27.2
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      - name: Upload artifacts
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fleet-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/fleet-integration.json
          if-no-files-found: error
          retention-days: 7
      - name: Verify exact source head
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: "Set up tools"
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: go python http:cicd-engineering

      - name: Test
        uses: ./.github/actions/test

      - name: "Upload artifacts"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gd-observe-addon-${{ env.SOURCE_SHA }}
          path: dist/@aviorstudio_gd-observe.zip
          if-no-files-found: error
          retention-days: 7
