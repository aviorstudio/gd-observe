name: CI

# CI and release call the same repository-local gate. The resulting addon ZIP
# is the tested artifact and release downloads it without rebuilding.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    # Bounded, so a step that hangs fails here rather than sitting until the
    # runner's own timeout hours later.
    timeout-minutes: 20
    steps:
      # Third-party actions are pinned by SHA, with the tag in a trailing
      # comment so the version is still readable. A tag is a moving reference:
      # whoever can move it can run code in this job.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Verify exact source head
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install_args: go python http:cicd-engineering

      - name: Test
        uses: ./.github/actions/test

      - name: Upload tested addon package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gd-observe-addon-${{ env.SOURCE_SHA }}
          path: dist/@aviorstudio_gd-observe.zip
          if-no-files-found: error
          retention-days: 7
